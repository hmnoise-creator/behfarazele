<script id="bfPassGate">
/* ===================== [BF-GATE] رمز ورود نسخهٔ آنلاین (GitHub Pages) =====================
   قبل از نمایش هر صفحه رمز خواسته می‌شود. بعد از ورود درست، همین مرورگر رمز را به خاطر می‌سپارد.
   رمز به‌صورت هش SHA-256 نگه داشته می‌شود (خود رمز داخل کد نیست).
   برای تغییر رمز، مقدار HASH را با هش رمز جدید عوض کنید (همهٔ دستگاه‌ها دوباره رمز می‌خواهند).
   برای خروج: localStorage.removeItem('bf_gate_v1') یا دکمهٔ «خروج از نسخهٔ آنلاین» در کنسول. */
(function(){
  var HASH = '9309e4219a24dab704eda32ce860f233b3a398ecc62d142112c34eba6e5362ba', KEY = 'bf_gate_v1';
  function ok(){ try{ return localStorage.getItem(KEY) === HASH; }catch(e){ return false; } }
  window.bfGateLogout = function(){ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); };
  if(ok()) return;
  var de = document.documentElement; de.classList.add('bf-locked');
  var st = document.createElement('style'); st.id = 'bfGateStyle';
  st.textContent = 'html.bf-locked body>*:not(#bfGate){display:none!important}html.bf-locked,html.bf-locked body{overflow:hidden!important;background:#0f3d3a!important}'
   + '#bfGate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f3d3a,#1f6f66);font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;padding:16px}'
   + '#bfGate form{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}'
   + '#bfGate h2{margin:0 0 6px;color:#0f3d3a;font-size:20px}#bfGate p{margin:0 0 18px;color:#5b6b69;font-size:13px}'
   + '#bfGate input{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #cfdcda;border-radius:12px;font-size:16px;text-align:center;direction:ltr;outline:none}'
   + '#bfGate input:focus{border-color:#1f8a7f}#bfGate button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#0f3d3a;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}'
   + '#bfGate .err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}';
  (document.head || de).appendChild(st);
  function unlock(){ de.classList.remove('bf-locked'); var g = document.getElementById('bfGate'); if(g) g.remove(); var s = document.getElementById('bfGateStyle'); if(s) s.remove(); try{ window.dispatchEvent(new Event('resize')); }catch(e){} }
  function sha(t){
    if(window.crypto && crypto.subtle && window.TextEncoder)
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); });
    return Promise.reject(new Error('nocrypto'));
  }
  window.addEventListener('storage', function(e){ if(e.key === KEY && ok()) unlock(); });
  function show(){
    if(document.getElementById('bfGate')) return;
    var g = document.createElement('div'); g.id = 'bfGate';
    g.innerHTML = '<form autocomplete="off"><h2>سامانهٔ بهفراز</h2><p>برای ورود، رمز را وارد کنید</p>'
      + '<input type="password" id="bfGatePw" placeholder="رمز ورود" autofocus><button type="submit">ورود</button><div class="err" id="bfGateErr"></div></form>';
    document.body.appendChild(g);
    var inp = g.querySelector('input'), err = g.querySelector('.err');
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
    g.querySelector('form').addEventListener('submit', function(ev){
      ev.preventDefault();
      sha(inp.value).then(function(h){
        if(h === HASH){ try{ localStorage.setItem(KEY, HASH); }catch(e){} unlock(); }
        else { err.textContent = 'رمز اشتباه است'; inp.select(); }
      }, function(){ err.textContent = 'مرورگر شما پشتیبانی نمی‌کند — صفحه را با https باز کنید'; });
    });
  }
  if(document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();
</script>

<style>
  :root{
    --teal:#0f3d3a;
    --teal2:#134a45;
    --line:#e3e7e6;
    --muted:#6b7a78;
    --bg:#f4f6f6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Vazirmatn","Tahoma",sans-serif;background:var(--bg);min-height:100vh;padding:22px;}
  .wrap{width:100%;max-width:960px;margin:0 auto;}
  .head{text-align:center;margin-bottom:18px;}
  .head h1{margin:0 0 6px;font-size:1.35rem;color:var(--teal);}
  .head p{margin:0;color:var(--muted);font-size:.9rem;}

  /* [BF-CAT-TABS] تب‌های گرافیکی */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
  .tab{position:relative;overflow:hidden;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:right;color:var(--teal);transition:transform .15s,box-shadow .2s,border-color .2s;box-shadow:0 2px 8px rgba(15,61,58,.05)}
  .tab:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,61,58,.12);border-color:#b9d7d2}
  .tab .ti{flex:0 0 52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:linear-gradient(135deg,#eaf6f3,#d6efe9);transition:.2s}
  .tab .tt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .tab .tt b{font-size:1rem;font-weight:900}
  .tab .tt small{font-size:.72rem;color:#6f8583;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab .n{margin-right:auto;min-width:34px;height:34px;border-radius:12px;background:#eaf4f2;color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem}
  .tab::after{content:"";position:absolute;inset:auto -40px -60px auto;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);opacity:0;transition:.2s}
  .tab[data-tab="cat"].on{background:linear-gradient(135deg,#0f3d3a,#17807a);border-color:transparent}
  .tab[data-tab="form"].on{background:linear-gradient(135deg,#3b2a7a,#6d4fd1);border-color:transparent}
  .tab.on{color:#fff;box-shadow:0 12px 28px rgba(15,61,58,.25)}.tab.on::after{opacity:1}
  .tab.on .ti{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .tab.on .tt small{color:rgba(255,255,255,.78)}.tab.on .n{background:rgba(255,255,255,.2);color:#fff}
  @media(max-width:560px){.tabs{gap:8px}.tab{padding:10px;gap:8px}.tab .ti{flex-basis:40px;height:40px;font-size:1.25rem;border-radius:12px}.tab .tt small{display:none}.tab .tt b{font-size:.86rem;white-space:nowrap}.tab .n{min-width:26px;height:26px;font-size:.8rem}}

  .search{position:relative;margin-bottom:14px}
  .search input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 40px 11px 14px;font:inherit;font-size:.9rem;background:#fff}
  .search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,61,58,.12)}
  .search .ic{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search .clr{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;background:#eef2f1;border-radius:8px;padding:3px 9px;cursor:pointer;font:inherit;font-size:.75rem;display:none}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--teal);border-radius:999px;padding:6px 14px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}

  .grp-t{margin:16px 0 8px;font-size:.9rem;font-weight:800;color:var(--teal2);display:flex;align-items:center;gap:8px}
  .grp-t small{color:var(--muted);font-weight:600}

  .cat-list{display:flex;flex-direction:column;gap:12px;}
  .cat-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;transition:box-shadow .15s ease,border-color .15s ease;}
  .cat-card:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(15,61,58,.10);}
  .cat-icon{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;}
  .cat-icon img{width:34px;height:34px;object-fit:contain;}
  .thumb{width:64px;height:80px;border:1px solid var(--line);border-radius:8px;flex:0 0 auto;background:#fff center/contain no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .thumb.land{width:84px;height:60px}
  .cat-body{flex:1 1 220px;min-width:180px;}
  .cat-body h2{margin:0 0 4px;font-size:1rem;color:#1a2b29;}
  .cat-body p{margin:0;font-size:.8rem;color:var(--muted);}
  .cat-body .fn{font-size:.72rem;color:#8a9896;direction:ltr;text-align:right;margin-top:3px}
  .cat-actions{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap;}
  .cat-btn{border:1.5px solid var(--line);background:#fff;color:var(--teal);border-radius:9px;padding:8px 13px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .cat-btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
  .cat-btn.primary:hover{background:var(--teal2);}
  .cat-btn:not(.primary):hover{border-color:var(--teal);background:#eaf4f2;}
  .cat-btn.copied{background:#0f6e56;color:#fff;border-color:#0f6e56;}
  mark{background:#ffe680;border-radius:3px;padding:0 1px}
  .empty{background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:.86rem}

  .viewer{display:none;margin-top:22px;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
  .viewer.show{display:block;}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--teal);color:#fff;flex-wrap:wrap;}
  .viewer-bar .t{font-size:.88rem;font-weight:700;}
  .viewer-bar .acts{display:flex;gap:8px;flex-wrap:wrap}
  .viewer-bar button,.viewer-bar a{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 12px;font-size:.78rem;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
  .viewer-bar button:hover,.viewer-bar a:hover{background:rgba(255,255,255,.28);}
  .viewer iframe{width:100%;height:72vh;border:none;display:block;}

  .modal-bg{position:fixed;inset:0;background:rgba(10,30,28,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h3{margin:0 0 8px;color:var(--teal);font-size:1rem}
  .modal p{margin:0 0 12px;font-size:.84rem;color:#33413f;line-height:1.9}
  .modal code{background:#eef2f1;border-radius:6px;padding:1px 6px;direction:ltr;display:inline-block}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f3d3a;color:#fff;padding:10px 18px;border-radius:10px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:70;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:560px){body{padding:12px}.cat-actions{width:100%}.cat-btn{flex:1;justify-content:center}}
  /* [BF-BANK] تب شماره حساب‌ها */
  .tabs{grid-template-columns:repeat(3,1fr)}
  .tab[data-tab="bank"].on{background:linear-gradient(135deg,#7a2a12,#c2410c);border-color:transparent}
  .bk-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
  .bk-add{border:0;background:linear-gradient(135deg,#c2410c,#ea580c);color:#fff;border-radius:11px;padding:9px 16px;font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(194,65,12,.25)}
  .bk-note{font-size:.76rem;color:var(--muted);flex:1 1 200px}
  .bk-list{display:flex;flex-direction:column;gap:12px}
  .bk{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;transition:.15s}
  .bk:hover{box-shadow:0 8px 22px rgba(15,61,58,.10);border-color:#cfd9d7}
  .bk-strip{flex:0 0 8px;background:var(--bc,#0f3d3a)}
  .bk-in{flex:1;min-width:0;padding:12px 14px}
  .bk-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .bk-logo{flex:0 0 40px;height:40px;border-radius:12px;background:var(--bc,#0f3d3a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem}
  .bk-who{flex:1 1 180px;min-width:0}
  .bk-who b{display:block;font-size:.98rem;color:#1a2b29}
  .bk-who small{color:var(--muted);font-size:.76rem}
  .bk-tag{display:inline-block;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;margin-inline-start:6px}
  .bk-acts{display:flex;gap:6px;flex-wrap:wrap}
  .bk-f{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:#f7f9f9;margin-top:6px;flex-wrap:wrap}
  .bk-f .k{flex:0 0 78px;font-size:.75rem;color:var(--muted);font-weight:700}
  .bk-f .v{flex:1 1 200px;direction:ltr;text-align:left;font-family:Consolas,"Courier New",monospace;font-size:1.02rem;font-weight:700;letter-spacing:.5px;color:#13302d;word-break:break-all}
  .bk-f .v.fa{direction:rtl;text-align:right;font-family:inherit;font-size:.86rem;letter-spacing:0;font-weight:600}
  .bk-cp{border:1.5px solid var(--line);background:#fff;color:var(--teal);border-radius:9px;padding:5px 12px;font:inherit;font-size:.76rem;font-weight:800;cursor:pointer;white-space:nowrap}
  .bk-cp:hover{border-color:var(--teal);background:#eaf4f2}
  .bk-cp.copied{background:#0f6e56;color:#fff;border-color:#0f6e56}
  .bk-all{background:var(--teal);color:#fff;border-color:var(--teal)}
  .bk-meta{font-size:.7rem;color:#9aa8a6;margin-top:6px}
  .bk-mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:.74rem;cursor:pointer;color:#33413f}
  .bk-mini.del{color:#b91c1c;border-color:#fecaca}
  .bk-form label{display:block;font-size:.8rem;color:#33413f;margin:9px 0 4px;font-weight:700}
  .bk-form input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:.9rem}
  .bk-form input.ltr{direction:ltr;text-align:left;font-family:Consolas,monospace;letter-spacing:.5px}
  .bk-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bk-hint{font-size:.74rem;min-height:16px;margin-top:3px}
  .bk-hint.ok{color:#0f6e56}.bk-hint.bad{color:#b91c1c}
  .bk-err{color:#b91c1c;font-size:.8rem;min-height:18px;margin-top:8px}
  .modal.wide{max-width:560px;max-height:92vh;overflow:auto}
  @media(max-width:560px){.bk-f .k{flex-basis:100%}.bk-form .row2{grid-template-columns:1fr}.tab .tt b{font-size:.78rem}}
  .bk-sec{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
  .bk-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;user-select:none}
  .bk-sec>summary::-webkit-details-marker{display:none}
  .bk-sec>summary:hover{background:#f7faf9}
  .bk-sec[open]>summary{border-bottom:1.5px solid var(--line);background:linear-gradient(135deg,#fff7ed,#fff)}
  .bk-si{flex:0 0 38px;height:38px;border-radius:12px;background:#fff1e6;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .bk-st{font-weight:900;color:#1a2b29;font-size:.95rem;white-space:nowrap}
  .bk-sn{background:#c2410c;color:#fff;border-radius:999px;min-width:24px;height:24px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800}
  .bk-sp{flex:1;min-width:0;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-chev{transition:transform .2s;color:var(--muted);font-size:1.1rem}
  .bk-sec[open] .bk-chev{transform:rotate(180deg)}
  .bk-sec .bk-list{padding:12px}
  @media(max-width:560px){.bk-sp{display:none}.bk-st{white-space:normal}}

<style id="bfMobileFix">
/* [BF-MOBILE] نمایش درست روی آیفون / موبایل: هیچ بخشی از صفحه از عرض گوشی بیرون نزند و نیازی به کشیدن صفحه به کنار نباشد.
   فقط روی صفحهٔ نمایش (screen) اعمال می‌شود؛ روی چاپ و PDF پیش‌فاکتور هیچ اثری ندارد. */

}

@media print{.bf-mscroll{overflow:visible !important;max-width:none !important;display:block}}

<body>

  <div class="wrap">
    <div class="head">
      <h1>🗂️ دبیرخانه دیجیتال</h1>
      <p>کاتالوگ محصولات، فرم‌های فنی و شماره حساب‌های مجموعه — همه در یک‌جا؛ نمایش، دانلود، چاپ و کپی سریع برای ارسال.</p>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab on" data-tab="cat"><span class="ti">📚</span><span class="tt"><b>کاتالوگ‌ها</b><small>کاتالوگ محصولات · مشاهده و دانلود PDF</small></span><span class="n" id="nCat"></span></button>
      <button type="button" class="tab" data-tab="form"><span class="ti">📝</span><span class="tt"><b>فرم‌های فنی</b><small>فرم کاراسلینگ · پشت‌برگ‌ها · فرم‌های داخلی</small></span><span class="n" id="nForm"></span></button>
      <button type="button" class="tab" data-tab="bank"><span class="ti">💳</span><span class="tt"><b>شماره حساب‌ها</b><small>کارت · شبا · حساب — کپی سریع برای ارسال</small></span><span class="n" id="nBank"></span></button>
    </div>

    <div class="search">
      <span class="ic">🔎</span>
      <input id="q" type="search" placeholder="جستجو بر اساس نام فایل — مثلاً «کاراسلینگ»، «پشت برگ شکیب»، «سربرگ»، «poshtbarg»" autocomplete="off">
      <button type="button" class="clr" id="qClr">✕ پاک کردن</button>
    </div>

    <div class="chips" id="grpChips"></div>
    <div id="list"></div>

    <div class="viewer" id="viewer">

  <iframe id="printFrame" style="position:fixed;width:0;height:0;border:0;left:-9999px;top:0" title="print"></iframe>

<script>
  /* ===== کاتالوگ‌ها =====
     pdf: مسیر فایل PDF کاتالوگ برای دانلود (داخل پوشهٔ public/catalogs). تا وقتی فایل گذاشته نشده، دکمهٔ دانلود راهنما نشان می‌دهد. */
  const CATALOGS = [
    { title:'کاتالوگ آنلاین - پنل‌های کابین و طبقه', desc:'مدل‌های پنل کابین (لمسی / استیل / یک‌متری) و پنل طبقه',
      url:'https://heyzine.com/flip-book/995345f6ff.html', pdf:'catalogs/catalog-panels.pdf', dl:'کاتالوگ پنل‌های کابین و طبقه - بهفراز.pdf' },
    { title:'کاتالوگ آنلاین - موتورهای جنتلرایز', desc:'معرفی موتورهای گیرلس جنتلرایز',
      url:'https://heyzine.com/flip-book/ccc5fb1397.html', pdf:'catalogs/catalog-gentlerise.pdf', dl:'کاتالوگ موتورهای جنتلرایز - بهفراز.pdf' },
    { title:'کاتالوگ آنلاین - مشخصات داینا لیفت', desc:'مشخصات فنی و معرفی محصولات داینا لیفت',
      url:'https://heyzine.com/flip-book/842ff79957.html', pdf:'catalogs/catalog-dynalift.pdf', dl:'کاتالوگ داینا لیفت - بهفراز.pdf' }
  ];

  /* ===== فرم‌های فنی (پوشهٔ public/forms) ===== */
  const GROUPS = [
    { id:'kar',  t:'🏗️ فرم کاراسلینگ' },
    { id:'pb',   t:'🧾 پشت‌برگ‌ها' },
    { id:'int',  t:'🏢 فرم‌های داخلی' }
  ];
  const FORMS = [
    { g:'kar', title:'فرم سفارش کاراسلینگ', desc:'ابعاد چاه، ریل، پیت و اورهد — برای ثبت دقیق سفارش کاراسلینگ', file:'forms/karasling-order-form.pdf', land:true, tags:'karasling کاراسلینگ کارا سلینگ چاه ریل' },
    { g:'pb',  title:'پشت‌برگ شکیب (جک و پاور یونیت)', desc:'جدول ردیابی سفارش / تولید / انبار — جک، پاور، رپچر، متعلقات شکیب', file:'forms/poshtbarg-shakib.pdf', tags:'poshtbarg پشت برگ پشتبرگ shakib شکیب جک پاور' },
    { g:'pb',  title:'پشت‌برگ ویتور (امارلیفت)', desc:'جدول ردیابی سفارش — جک، پاوریونیت، درخت سیم، برد هووس و درایو', file:'forms/poshtbarg-wittur.pdf', tags:'poshtbarg پشت برگ پشتبرگ wittur ویتور امارلیفت omarlift 110' },
    { g:'pb',  title:'پشت‌برگ موتور', desc:'جدول ردیابی سفارش — موتور، فلکه، بسته خدمات و قطعات', file:'forms/poshtbarg-motor.pdf', tags:'poshtbarg پشت برگ پشتبرگ motor موتور گیرلس جنتلرایز داینا هوبر' },
    { g:'int', title:'سربرگ شرکت بهفراز', desc:'سربرگ رسمی A4 با تاریخ، شماره و پیوست', file:'forms/sarbarg-behfaraz.pdf', tags:'sarbarg سربرگ سر برگ letterhead نامه' },
    { g:'int', title:'فرم درخواست مساعده', desc:'درخواست مساعده کسر از حقوق — با تأیید مدیر', file:'forms/mosaede-request.pdf', word:'forms/mosaede-request.docx', tags:'mosaede مساعده حقوق پرسنل' },
    { g:'int', title:'برچسب ارسال بار — شکیب جک', desc:'آدرس فرستنده (بهفراز) و گیرنده (شکیب جک — کرج)', file:'forms/label-shakib.pdf', land:true, tags:'label برچسب ارسال پست آدرس shakib شکیب' },
    { g:'int', title:'برچسب ارسال بار — سنا پنل', desc:'آدرس فرستنده (بهفراز) و گیرنده (سنا پنل — مشهد)', file:'forms/label-sena.pdf', land:true, tags:'label برچسب ارسال پست آدرس sena سنا' },
    { g:'int', title:'برچسب ارسال بار — سلکوم', desc:'آدرس فرستنده (بهفراز) و گیرنده (آقای کشاورز — تهران)', file:'forms/label-selecom.pdf', word:'forms/label-selecom.docx', land:true, tags:'label برچسب ارسال پست آدرس selecom سلکوم کشاورز' }
  ];

  const $ = id => document.getElementById(id);
  let tab = 'cat', grp = '', q = '';
  try{ const s = JSON.parse(localStorage.getItem('bf_catalog_ui') || 'null'); if(s){ tab = s.tab || 'cat'; grp = s.grp || ''; } }catch(e){}
  function remember(){ try{ localStorage.setItem('bf_catalog_ui', JSON.stringify({tab, grp})); }catch(e){} }

  function showToast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),2400); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return String(s||'').replace(/[‌‍]/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[ـ]/g,'').replace(/[-_.]/g,' ').replace(/\s+/g,' ').trim().toLowerCase(); }
  function tokens(){ return norm(q).split(' ').filter(Boolean); }
  function match(txt){ const T=tokens(); if(!T.length) return true; const n=norm(txt), nn=n.replace(/\s/g,''); return T.every(t=>n.indexOf(t)>=0 || nn.indexOf(t)>=0); }
  function hl(s){ let h=esc(s); tokens().forEach(t=>{ if(t.length<2) return; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h=h.replace(re,'<mark>$1</mark>'); }); return h; }
  function fileName(p){ return String(p||'').split('/').pop(); }

  /* ---- مودال ---- */
  function modal(html){ $('modal').classList.remove('wide'); $('modal').innerHTML=html; $('modalBg').classList.add('show'); }
  function closeModal(){ $('modalBg').classList.remove('show'); }
  $('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg' || e.target.closest('[data-close]')) closeModal(); });

  /* ---- وجود فایل ---- */
  function exists(path){
    if(location.protocol==='file:') return Promise.resolve(true);
    return fetch(path,{method:'HEAD',cache:'no-store'}).then(r=>r.ok).catch(()=>false);
  }
  function download(path, name){
    exists(path).then(ok=>{
      if(!ok){ missing(path, name); return; }
      const nm=name || fileName(path);
      function go(href){ const a=document.createElement('a'); a.href=href; a.download=nm; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); if(href.indexOf('blob:')===0) URL.revokeObjectURL(href); },1500); }
      if(location.protocol==='file:'){ go(path); }
      else fetch(path,{cache:'no-store'}).then(r=>r.blob()).then(b=>go(URL.createObjectURL(b))).catch(()=>go(path));
      showToast('⬇️ دانلود «'+nm+'» شروع شد');
    });
  }
  function missing(path, name, cat){
    modal('<h3>📄 فایل PDF هنوز اضافه نشده</h3><p>فایل PDF «'+esc(name||fileName(path))+'» روی سرور پیدا نشد.<br>برای فعال شدن دانلود، فایل PDF را با نام <code>'+esc(fileName(path))+'</code> در پوشهٔ <code>public/'+esc(path.split('/').slice(0,-1).join('/'))+'</code> سرور قرار دهید.</p>'+
      (cat?'<p style="color:#6b7a78">تا آن زمان می‌توانید نسخهٔ آنلاین را باز کنید؛ اگر در کاتالوگ آنلاین دکمهٔ دانلود فعال باشد، از همان‌جا هم قابل دریافت است.</p>':'')+
      '<div class="acts">'+(cat?'<a class="cat-btn primary" href="'+esc(cat.url)+'" target="_blank" rel="noopener">🔗 باز کردن کاتالوگ آنلاین</a>':'')+'<button type="button" class="cat-btn" data-close="1">بستن</button></div>');
  }

  /* ---- چاپ ---- */
  function printFile(path, title){
    exists(path).then(ok=>{
      if(!ok){ missing(path, title); return; }
      const fr=$('printFrame');
      showToast('🖨️ آماده‌سازی چاپ «'+title+'»…');
      fr.onload=function(){
        if(fr.src==='about:blank' || !fr.src) return;
        setTimeout(()=>{
          try{ fr.contentWindow.focus(); fr.contentWindow.print(); }
          catch(e){ window.open(path,'_blank'); showToast('فایل در تب جدید باز شد — از آنجا چاپ کنید (Ctrl+P)'); }
        }, 600);
      };
      fr.src = path + (path.indexOf('?')>=0?'&':'?') + 't=' + Date.now();
    });
  }

  /* ---- نمایش در صفحه ---- */
  function openViewer(title, src, acts){
    $('viewerTitle').textContent = title;
    $('viewerFrame').src = src;
    $('viewerActs').innerHTML = acts + '<button type="button" id="viewerClose">✕ بستن</button>';
    $('viewer').classList.add('show');
    $('viewer').scrollIntoView({behavior:'smooth', block:'start'});
  }
  function closeViewer(){ $('viewer').classList.remove('show'); $('viewerFrame').src='about:blank'; }

  /* ---- کپی لینک ---- */
  function copyLink(url, btn){
    const done=()=>{ showToast('لینک کاتالوگ کپی شد ✅'); if(btn){ const o=btn.innerHTML; btn.innerHTML='✅ کپی شد'; btn.classList.add('copied'); setTimeout(()=>{ btn.innerHTML=o; btn.classList.remove('copied'); },1600); } };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done)); } else fallbackCopy(url,done);
  }
  function fallbackCopy(url, done){ const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ showToast('کپی نشد — لینک را دستی انتخاب کنید'); } ta.remove(); }

  /* ---- رندر ---- */
  function catHtml(){
    const L = CATALOGS.map((c,i)=>({c,i})).filter(x=>match([x.c.title,x.c.desc,fileName(x.c.pdf),x.c.dl].join(' ')));
    if(!L.length) return '<div class="empty">کاتالوگی با «'+esc(q)+'» پیدا نشد.</div>';
    return '<div class="cat-list">'+L.map(({c,i})=>`
      <div class="cat-card">
        <div class="cat-icon"><img src="./catalog-icon.png" alt="کاتالوگ"></div>
        <div class="cat-body"><h2>${hl(c.title)}</h2><p>${hl(c.desc)}</p><div class="fn">${hl(fileName(c.pdf))}</div></div>
        <div class="cat-actions">
          <button type="button" class="cat-btn primary" data-act="cview" data-i="${i}">🔍 نمایش کاتالوگ</button>
          <button type="button" class="cat-btn" data-act="cdl" data-i="${i}">⬇️ دانلود PDF</button>
          <button type="button" class="cat-btn" data-act="ccopy" data-i="${i}">🔗 کپی لینک</button>
        </div>
      </div>`).join('')+'</div>';
  }
  function formHtml(){
    const L = FORMS.map((f,i)=>({f,i})).filter(x=>(!grp||x.f.g===grp) && match([x.f.title,x.f.desc,fileName(x.f.file),x.f.tags].join(' ')));
    if(!L.length) return '<div class="empty">فرمی با این جستجو پیدا نشد.</div>';
    return GROUPS.filter(g=>!grp||g.id===grp).map(g=>{
      const G=L.filter(x=>x.f.g===g.id); if(!G.length) return '';
      return '<div class="grp-t">'+g.t+' <small>('+G.length.toLocaleString('fa-IR')+' فرم)</small></div><div class="cat-list">'+G.map(({f,i})=>{
        const th=f.file.replace(/^forms\//,'forms/thumbs/').replace(/\.pdf$/,'.png');
        return `<div class="cat-card">
          <div class="thumb${f.land?' land':''}" style="background-image:url('${th}')"></div>
          <div class="cat-body"><h2>${hl(f.title)}</h2><p>${hl(f.desc)}</p><div class="fn">${hl(fileName(f.file))}</div></div>
          <div class="cat-actions">
            <button type="button" class="cat-btn primary" data-act="fprint" data-i="${i}">🖨️ چاپ</button>
            <button type="button" class="cat-btn" data-act="fview" data-i="${i}">🔍 نمایش</button>
            <button type="button" class="cat-btn" data-act="fdl" data-i="${i}">⬇️ دانلود PDF</button>
            ${f.word?`<button type="button" class="cat-btn" data-act="fword" data-i="${i}" title="نسخهٔ قابل ویرایش Word">📝 Word</button>`:''}
          </div>
        </div>`}).join('')+'</div>';
    }).join('');
  }
  function render(){
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
    $('nCat').textContent = CATALOGS.length.toLocaleString('fa-IR');
    $('nForm').textContent = FORMS.length.toLocaleString('fa-IR');
    $('nBank').textContent = BK.rows.length.toLocaleString('fa-IR');
    $('grpChips').style.display = tab==='form' ? '' : 'none';
    if(tab==='bank'){ $('grpChips').innerHTML=''; $('list').innerHTML = bkHtml(); $('qClr').style.display = q ? 'inline-block' : 'none'; return; }
    $('grpChips').innerHTML = [{id:'',t:'همه'}].concat(GROUPS).map(g=>`<button type="button" class="chip${grp===g.id?' on':''}" data-grp="${g.id}">${g.t}</button>`).join('');
    $('list').innerHTML = tab==='cat' ? catHtml() : formHtml();
    $('qClr').style.display = q ? 'inline-block' : 'none';
  }

  $('tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; tab=b.dataset.tab; remember(); closeViewer(); render(); });
  $('grpChips').addEventListener('click', e=>{ const b=e.target.closest('[data-grp]'); if(!b) return; grp=b.dataset.grp; remember(); render(); });
  $('q').addEventListener('input', e=>{ q=e.target.value; clearTimeout(render._t); render._t=setTimeout(()=>{
    /* اگر چیزی فقط در تب دیگر پیدا شد، خودکار به همان تب برود */
    if(q){ const inCat=CATALOGS.some(c=>match([c.title,c.desc,fileName(c.pdf),c.dl].join(' '))), inForm=FORMS.some(f=>match([f.title,f.desc,fileName(f.file),f.tags].join(' ')));
      const inBank=BK.rows.some(bkMatch);
      if(tab!=='bank'){ if(tab==='cat'&&!inCat&&inForm){ tab='form'; grp=''; } else if(tab==='form'&&!inForm&&inCat){ tab='cat'; } else if(!inCat&&!inForm&&inBank){ tab='bank'; } }
      else if(!inBank&&(inCat||inForm)){ tab=inCat?'cat':'form'; } }
    render(); },150); });
  $('qClr').addEventListener('click', ()=>{ q=''; $('q').value=''; render(); $('q').focus(); });
  $('viewerActs').addEventListener('click', e=>{ if(e.target.id==='viewerClose') closeViewer(); });
  $('viewerActs').addEventListener('click', e=>{ const b=e.target.closest('[data-vact]'); if(!b) return; const f=FORMS[+b.dataset.i]; if(b.dataset.vact==='print') printFile(f.file,f.title); else download(f.file,f.title+'.pdf'); });

  $('list').addEventListener('click', e=>{
    const b=e.target.closest('[data-act]'); if(!b) return; const i=+b.dataset.i, act=b.dataset.act;
    if(act.indexOf('bk')===0){ bkAction(act, b); return; }
    if(act==='cview'){ const c=CATALOGS[i]; openViewer(c.title, c.url, `<a href="${esc(c.url)}" target="_blank" rel="noopener">🔗 باز کردن در تب جدید</a>`); return; }
    if(act==='ccopy'){ copyLink(CATALOGS[i].url, b); return; }
    if(act==='cdl'){ const c=CATALOGS[i]; exists(c.pdf).then(ok=>{ if(ok) download(c.pdf, c.dl); else missing(c.pdf, c.dl, c); }); return; }
    const f=FORMS[i];
    if(act==='fprint'){ printFile(f.file, f.title); return; }
    if(act==='fdl'){ download(f.file, f.title+'.pdf'); return; }
    if(act==='fword'){ download(f.word, f.title+'.docx'); return; }
    if(act==='fview'){ openViewer(f.title, f.file, `<button type="button" data-vact="print" data-i="${i}">🖨️ چاپ</button><button type="button" data-vact="dl" data-i="${i}">⬇️ دانلود PDF</button><a href="${esc(f.file)}" target="_blank" rel="noopener">🔗 تب جدید</a>`); return; }
  });

  /* ===================== [BF-BANK] 💳 شماره حساب‌ها =====================
     ذخیره روی سرور (همهٔ کاربران واردشده ثبت می‌کنند؛ ویرایش/حذف: ثبت‌کننده یا مدیریت).
     اگر سرور در دسترس نباشد (نسخهٔ آفلاین)، همین فهرست پیش‌فرض فقط‌خواندنی نشان داده می‌شود. */

    { id:'f1', cat:'کارت‌های مجموعه (کارت به کارت)', title:'صادرات تسهیلات', bank:'بانک صادرات ایران', owner:'ناصر سیمنی', card:'6037698108071684', sheba:'IR840190000000219548562006', account:'', branch:'', note:'انقضا ۱۴۰۸/۰۸' },
    { id:'f2', cat:'کارت‌های مجموعه (کارت به کارت)', title:'صادرات سپرده', bank:'بانک صادرات ایران', owner:'ناصر سیمنی', card:'6037697508202246', sheba:'IR530190000000215258814000', account:'', branch:'', note:'' },
    { id:'f3', cat:'کارت‌های مجموعه (کارت به کارت)', title:'صادرات', bank:'بانک صادرات ایران', owner:'ناصر سیمنی', card:'6037697516547053', sheba:'IR650190000000112764620003', account:'', branch:'', note:'' },
    { id:'f4', cat:'کارت‌های مجموعه (کارت به کارت)', title:'رفاه', bank:'بانک رفاه کارگران', owner:'ساغر دهقان نژاد قهفرخی', card:'5894631876300161', sheba:'IR340130100000000076451628', account:'', branch:'', note:'' },
    { id:'f9', cat:'حساب‌های شخصی آقای سیمنی', title:'رفاه شخصی آقای سیمنی', bank:'بانک رفاه کارگران', owner:'ناصر سیمنی', card:'5894631143162246', sheba:'IR830130100000000075884460', account:'', branch:'', note:'' },
    { id:'f10', cat:'حساب‌های شخصی آقای سیمنی', title:'پارسیان شخصی (خانم دهقان نژاد)', bank:'بانک پارسیان', owner:'ساغر دهقان نژاد قهفرخی', card:'6221061047683547', sheba:'IR260540207580001742837005', account:'', branch:'', note:'' },
    { id:'f7', cat:'کارت‌های کارکنان شرکت', title:'ملی بهفراز', bank:'بانک ملی ایران', owner:'خانم زمردی', card:'', sheba:'IR030170000000364710848007', account:'', branch:'', note:'' },
    { id:'f8', cat:'کارت‌های کارکنان شرکت', title:'صادرات', bank:'بانک صادرات ایران', owner:'غزاله هاشمی', card:'', sheba:'IR820190000000317909428004', account:'', branch:'', note:'' },
    { id:'f5', cat:'حساب‌های رسمی تأمین‌کنندگان', title:'رسمی شکیب', bank:'بانک توسعه', owner:'شرکت آسانبر صعود البرز (داود پاکانیان)', card:'', sheba:'IR100220170701117148944001', account:'', branch:'', note:'' },
    { id:'f6', cat:'حساب‌های رسمی تأمین‌کنندگان', title:'رسمی 110', bank:'بانک پارسیان', owner:'فن آفرین سداد بین الملل', card:'', sheba:'IR400540100720100732623601', account:'100720100732623601', branch:'شعبه کریمخان — کد شعبه 1007', note:'' }
  ];
  const BK_CAT_ORDER = ['کارت‌های مجموعه (کارت به کارت)','حساب‌های شخصی آقای سیمنی','کارت‌های کارکنان شرکت','حساب‌های رسمی تأمین‌کنندگان'];
  const BK_CAT_ICON = c => /شخصی/.test(c)?'👤':/کارکنان/.test(c)?'👥':(/رسمی/.test(c)?'🏛️':'💳');
  let BK_OPEN = {}; try{ BK_OPEN = JSON.parse(localStorage.getItem('bf_bank_open')||'{}')||{}; }catch(e){}

  const BK = { rows: BK_FALLBACK.slice(), online:false, me:'', mgr:false, loaded:false };
  // تشخیص بانک از ۶ رقم اول کارت (BIN) و کد بانک در شبا
  const BK_BIN = {'603769':'صادرات ایران','589463':'رفاه کارگران','610433':'ملت','991975':'ملت','603799':'ملی ایران','589210':'سپه','627353':'تجارت','585983':'تجارت','627412':'اقتصاد نوین','502229':'پاسارگاد','639347':'پاسارگاد','621986':'سامان','627488':'کارآفرین','502908':'توسعه تعاون','627961':'صنعت و معدن','603770':'کشاورزی','639217':'کشاورزی','628023':'مسکن','639607':'سرمایه','636214':'آینده','502806':'شهر','504706':'شهر','627648':'توسعه صادرات','207177':'توسعه صادرات','505785':'ایران زمین','639346':'سینا','606373':'قرض‌الحسنه مهر ایران','505416':'گردشگری','636949':'حکمت ایرانیان','507677':'نور','504172':'رسالت','505801':'کوثر','606256':'ملل','628157':'موسسه توسعه','622106':'پارسیان','639194':'پارسیان','627884':'پارسیان','627760':'پست بانک','502938':'دی','585947':'خاورمیانه','636795':'مرکزی'};
  const BK_IBAN = {'010':'مرکزی','011':'صنعت و معدن','012':'ملت','013':'رفاه کارگران','014':'مسکن','015':'سپه','016':'کشاورزی','017':'ملی ایران','018':'تجارت','019':'صادرات ایران','020':'توسعه صادرات','021':'پست بانک','022':'توسعه تعاون','051':'موسسه توسعه','053':'کارآفرین','054':'پارسیان','055':'اقتصاد نوین','056':'سامان','057':'پاسارگاد','058':'سرمایه','059':'سینا','060':'قرض‌الحسنه مهر ایران','061':'شهر','062':'آینده','064':'گردشگری','065':'حکمت ایرانیان','066':'دی','069':'ایران زمین','070':'رسالت','073':'کوثر','075':'ملل','078':'خاورمیانه','080':'نور'};
  const BK_COLOR = {'صادرات':'#1e3a8a','رفاه':'#9d174d','پارسیان':'#7f1d1d','توسعه':'#0e7490','ملت':'#b91c1c','ملی':'#1d4ed8','سپه':'#0369a1','تجارت':'#1e40af','کشاورزی':'#15803d','مسکن':'#c2410c','سامان':'#0284c7','پاسارگاد':'#a16207','اقتصاد نوین':'#7c3aed','آینده':'#ea580c','شهر':'#be123c'};
  function bkToEn(v){ return String(v==null?'':v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
  function bkDig(v){ return bkToEn(v).replace(/\D/g,''); }
  function bkLuhn(c){ if(!/^\d{16}$/.test(c)) return false; let t=0; c.split('').reverse().forEach((x,i)=>{ let d=+x; if(i%2){ d*=2; if(d>9) d-=9; } t+=d; }); return t%10===0; }
  function bkIbanOk(s){ if(!/^IR\d{24}$/.test(s)) return false; const r=s.slice(4)+'1827'+s.slice(2,4); let m=0; for(const ch of r){ m=(m*10+ +ch)%97; } return m===1; }
  function bkBankOf(card, sheba){ if(card && BK_BIN[card.slice(0,6)]) return 'بانک '+BK_BIN[card.slice(0,6)]; if(sheba && sheba.length>=7 && BK_IBAN[sheba.slice(4,7)]) return 'بانک '+BK_IBAN[sheba.slice(4,7)]; return ''; }
  function bkColor(bank){ const k=Object.keys(BK_COLOR).find(k=>String(bank||'').indexOf(k)>=0); return k?BK_COLOR[k]:'#0f3d3a'; }
  function bkInitial(bank){ const n=String(bank||'').replace(/^بانک\s*/,'').trim(); return n?n.charAt(0):'🏦'; }
  function fmtCard(c){ return c ? c.replace(/(\d{4})(?=\d)/g,'$1 ') : ''; }
  function fmtSheba(s){ return s ? s.slice(0,4)+' '+s.slice(4).replace(/(\d{4})(?=\d)/g,'$1 ') : ''; }
  function bkMatch(r){ return match([r.cat,r.title,r.bank,r.owner,r.card,fmtCard(r.card),r.sheba,r.account,r.branch,r.note].join(' ')); }
  function bkTok(){ try{ const o=JSON.parse(sessionStorage.getItem('bf_operator_session_v1')||'null'); return o&&o.token||''; }catch(e){ return ''; } }
  function bkApi(method, url, body){
    const h={'Content-Type':'application/json'}, t=bkTok(); if(t) h['x-operator-token']=t;
    return fetch(url,{method, headers:h, body: body?JSON.stringify(body):undefined, cache:'no-store'}).then(r=>{
      const ct=r.headers.get('content-type')||''; if(ct.indexOf('json')<0) throw new Error('سرور هنوز نسخهٔ جدید را اجرا نمی‌کند — server.js را دوباره اجرا کنید');
      return r.json().then(j=>{ if(!r.ok||!j.ok) throw new Error(j.error||'خطا'); return j; }); });
  }
  let bkTries=0;
  function bkLoad(){
    if(location.protocol==='file:'){ render(); return; }
    if(!bkTok()){ if(bkTries++<200) setTimeout(bkLoad, 3000); render(); return; }
    bkApi('GET','/api/bank-accounts').then(j=>{ BK.rows=j.rows||[]; BK.online=true; BK.me=j.me; BK.mgr=!!j.isManager; BK.loaded=true; render(); })
      .catch(e=>{ console.warn('[BF-BANK]', e); BK.loaded=true; render(); });
  }
  function bkCanEdit(r){ return BK.online && BK.mgr; }   // ویرایش و حذف فقط ادمین و مدیریت؛ بقیه فقط ثبت
  function bkText(r){
    const L=[ (r.bank||'')+' — به نام '+r.owner ];
    if(r.card) L.push('شماره کارت: '+fmtCard(r.card).replace(/ /g,'-'));
    if(r.sheba) L.push('شماره شبا: '+r.sheba);
    if(r.account) L.push('شماره حساب: '+r.account);
    if(r.branch) L.push(r.branch);
    return L.join('\n');
  }
  function bkField(label, show, copyVal, i, kind, fa){
    return `<div class="bk-f"><span class="k">${label}</span><span class="v${fa?' fa':''}">${hl(show)}</span>${copyVal?`<button type="button" class="bk-cp" data-act="bkcopy" data-i="${i}" data-k="${kind}">📋 کپی</button>`:''}</div>`;
  }
  function bkHtml(){
    $('nBank').textContent = BK.rows.length.toLocaleString('fa-IR');
    const L = BK.rows.map((r,i)=>({r,i})).filter(x=>bkMatch(x.r));
    const bar = `<div class="bk-bar"><button type="button" class="bk-add" data-act="bkadd" data-i="-1">➕ ثبت شماره حساب جدید</button><span class="bk-note">${BK.online?'روی هر بخش بزنید تا باز شود؛ «📋 کپی» یا «کپی همه» را بزنید و در پیام‌رسان بفرستید.'+(BK.mgr?' · شما (مدیریت) ویرایش و حذف هم دارید.':' · ثبت حساب جدید برای همه آزاد است؛ ویرایش و حذف با مدیریت.'):(location.protocol==='file:'||!bkTok()?'نسخهٔ آفلاین — فقط مشاهده و کپی. ثبت حساب جدید بعد از ورود به سامانه.':'در حال بارگذاری از سرور…')}</span></div>`;
    if(!L.length) return bar+'<div class="empty">حسابی'+(q?' با «'+esc(q)+'»':'')+' پیدا نشد.</div>';
    const cats=[]; L.forEach(x=>{ if(cats.indexOf(x.r.cat)<0) cats.push(x.r.cat); });
    cats.sort((a,b)=>{ const ia=BK_CAT_ORDER.indexOf(a), ib=BK_CAT_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
    return bar + cats.map(c=>{ const G=L.filter(x=>x.r.cat===c), open = q || BK_OPEN[c];
      return '<details class="bk-sec" data-cat="'+esc(c)+'"'+(open?' open':'')+'><summary><span class="bk-si">'+BK_CAT_ICON(c)+'</span><span class="bk-st">'+esc(c)+'</span><span class="bk-sn">'+G.length.toLocaleString('fa-IR')+'</span><span class="bk-sp">'+G.map(x=>esc(x.r.title||x.r.owner)).slice(0,4).join(' · ')+(G.length>4?' …':'')+'</span><span class="bk-chev">▾</span></summary><div class="bk-list">'+G.map(({r,i})=>`
        <div class="bk" style="--bc:${bkColor(r.bank)}"><div class="bk-strip"></div><div class="bk-in">
          <div class="bk-top"><div class="bk-logo">${esc(bkInitial(r.bank))}</div>
            <div class="bk-who"><b>${hl(r.title||r.owner)}${r.note?`<span class="bk-tag">${hl(r.note)}</span>`:''}</b><small>${r.title?'به نام '+hl(r.owner)+' · ':''}${hl(r.bank||'')}${r.branch?' · '+hl(r.branch):''}</small></div>
            <div class="bk-acts"><button type="button" class="bk-cp bk-all" data-act="bkcopy" data-i="${i}" data-k="all">📋 کپی همه برای ارسال</button>
              ${bkCanEdit(r)?`<button type="button" class="bk-mini" data-act="bkedit" data-i="${i}">✏️ ویرایش</button><button type="button" class="bk-mini del" data-act="bkdel" data-i="${i}">🗑️</button>`:''}</div></div>
          ${r.card?bkField('شماره کارت', fmtCard(r.card), 1, i, 'card'):''}
          ${r.sheba?bkField('شماره شبا', fmtSheba(r.sheba), 1, i, 'sheba'):''}
          ${r.account?bkField('شماره حساب', r.account, 1, i, 'account'):''}
          ${BK.online&&r.created_by&&r.created_by!=='سیستم'?`<div class="bk-meta">ثبت: ${esc(r.created_by)}${r.updated_by&&r.updated_by!==r.created_by?' · ویرایش: '+esc(r.updated_by):''}</div>`:''}
        </div></div>`).join('')+'</div></details>';
    }).join('');
  }
  function bkCopy(text, btn, msg){
    const done=()=>{ showToast(msg||'کپی شد ✅'); if(btn){ const o=btn.innerHTML; btn.innerHTML='✅ کپی شد'; btn.classList.add('copied'); setTimeout(()=>{ btn.innerHTML=o; btn.classList.remove('copied'); },1500); } };
    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); } else fallbackCopy(text,done);
  }
  function bkAction(act, b){
    const i=+b.dataset.i, r=BK.rows[i];
    if(act==='bkcopy'){ const k=b.dataset.k;
      if(k==='all') return bkCopy(bkText(r), b, 'متن کامل حساب کپی شد ✅');
      if(k==='card') return bkCopy(r.card, b, 'شماره کارت کپی شد ✅');
      if(k==='sheba') return bkCopy(r.sheba, b, 'شبا کپی شد ✅');
      if(k==='account') return bkCopy(r.account, b, 'شماره حساب کپی شد ✅');
    }
    if(act==='bkadd' || act==='bkedit'){
      if(!BK.online){ modal('<h3>💳 ثبت شماره حساب</h3><p>برای ثبت حساب جدید باید از داخل سامانه (بعد از ورود) و روی شبکهٔ دفتر باشید.</p><div class="acts"><button type="button" class="cat-btn" data-close="1">بستن</button></div>'); return; }
      return bkForm(act==='bkedit'?r:null);
    }
    if(act==='bkdel'){
      if(!confirm('حذف حساب «'+(r.title||r.owner)+' — '+r.owner+'»؟\n(در تاریخچهٔ سرور ثبت می‌شود)')) return;
      bkApi('DELETE','/api/bank-accounts/'+r.id).then(()=>{ showToast('🗑️ حذف شد'); bkLoad(); }).catch(e=>alert('❌ '+e.message));
    }
  }
  function bkForm(r){
    const cats=[]; BK.rows.forEach(x=>{ if(x.cat && cats.indexOf(x.cat)<0) cats.push(x.cat); });
    const v=r||{cat:cats[0]||'کارت‌های مجموعه (کارت به کارت)',title:'',bank:'',owner:'',card:'',sheba:'',account:'',branch:'',note:''};
    modal(`<h3>${r?'✏️ ویرایش شماره حساب':'➕ ثبت شماره حساب جدید'}</h3>
      <div class="bk-form">
        <label>عنوان حساب (همان اسمی که صدایش می‌زنیم)</label><input id="bkTitle" value="${esc(v.title||'')}" placeholder="مثلاً: صادرات تسهیلات، صادرات سپرده، ملی بهفراز">
        <label>نام صاحب حساب *</label><input id="bkOwner" value="${esc(v.owner)}" placeholder="مثلاً: ناصر سیمنی یا نام شرکت">
        <label>شماره کارت (۱۶ رقم)</label><input id="bkCard" class="ltr" inputmode="numeric" value="${esc(fmtCard(v.card))}" placeholder="6037 6975 ...."><div class="bk-hint" id="bkCardH"></div>
        <label>شماره شبا</label><input id="bkSheba" class="ltr" value="${esc(v.sheba)}" placeholder="IR..."><div class="bk-hint" id="bkShebaH"></div>
        <div class="row2"><div><label>شماره حساب</label><input id="bkAcc" class="ltr" inputmode="numeric" value="${esc(v.account)}"></div>
          <div><label>نام بانک</label><input id="bkBank" value="${esc(v.bank)}" placeholder="خودکار از کارت/شبا"></div></div>
        <label>شعبه / کد شعبه</label><input id="bkBranch" value="${esc(v.branch)}">
        <div class="row2"><div><label>دسته‌بندی</label><input id="bkCat" list="bkCats" value="${esc(v.cat)}"><datalist id="bkCats">${cats.concat(BK_CAT_ORDER.concat(['حساب‌های رسمی شرکت'])).filter((c,k,a)=>a.indexOf(c)===k).map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
          <div><label>برچسب / توضیح کوتاه</label><input id="bkNote" value="${esc(v.note)}" placeholder="مثلاً: رسمی شکیب"></div></div>
        <div class="bk-err" id="bkErr"></div>
      </div>
      <div class="acts" style="margin-top:10px"><button type="button" class="cat-btn primary" id="bkSave">💾 ذخیره</button><button type="button" class="cat-btn" data-close="1">انصراف</button></div>`);
    $('modal').classList.add('wide');
    const C=$('bkCard'), S=$('bkSheba'), Bk=$('bkBank'); let bankTouched=!!v.bank;
    Bk.addEventListener('input',()=>{ bankTouched=!!Bk.value.trim(); });
    function chk(){
      const c=bkDig(C.value), s=bkDig(S.value), sh=s?('IR'+s):'';
      const ch=$('bkCardH'), sH=$('bkShebaH');
      ch.className='bk-hint'+(c?(c.length===16&&bkLuhn(c)?' ok':' bad'):''); ch.textContent=!c?'':(c.length!==16?('⚠️ '+c.length+' رقم — باید ۱۶ رقم باشد'):(bkLuhn(c)?'✔ شماره کارت معتبر است'+(BK_BIN[c.slice(0,6)]?' — بانک '+BK_BIN[c.slice(0,6)]:''):'⚠️ رقم کنترل کارت درست نیست؛ دوباره بررسی کنید'));
      sH.className='bk-hint'+(s?(bkIbanOk(sh)?' ok':' bad'):''); sH.textContent=!s?'':(s.length!==24?('⚠️ '+s.length+' رقم بعد از IR — باید ۲۴ رقم باشد'):(bkIbanOk(sh)?'✔ شبا معتبر است'+(BK_IBAN[sh.slice(4,7)]?' — بانک '+BK_IBAN[sh.slice(4,7)]:''):'⚠️ رقم کنترل شبا درست نیست؛ دوباره بررسی کنید'));
      if(!bankTouched){ const b=bkBankOf(c.length>=6?c:'', s.length>=5?sh:''); if(b) Bk.value=b; }
    }
    C.addEventListener('input',()=>{ const d=bkDig(C.value).slice(0,16); C.value=fmtCard(d); chk(); });
    S.addEventListener('input',()=>{ const d=bkDig(S.value).slice(0,24); S.value=d?('IR'+d):''; chk(); });
    chk(); setTimeout(()=>$('bkTitle').focus(),30);
    $('bkSave').onclick=function(){
      const body={ title:$('bkTitle').value.trim(), owner:$('bkOwner').value.trim(), card:bkDig(C.value), sheba:bkDig(S.value), account:bkDig($('bkAcc').value), bank:Bk.value.trim(), branch:$('bkBranch').value.trim(), cat:$('bkCat').value.trim(), note:$('bkNote').value.trim() };
      const E=$('bkErr'); E.textContent='';
      if(!body.owner){ E.textContent='نام صاحب حساب را وارد کنید.'; return; }
      if(!body.card && !body.sheba && !body.account){ E.textContent='حداقل یکی از شماره کارت، شبا یا حساب را وارد کنید.'; return; }
      if(body.card && body.card.length!==16){ E.textContent='شماره کارت باید ۱۶ رقم باشد.'; return; }
      if(body.sheba && body.sheba.length!==24){ E.textContent='شبا باید IR + ۲۴ رقم باشد.'; return; }
      if((body.card && !bkLuhn(body.card)) || (body.sheba && !bkIbanOk('IR'+body.sheba))){ if(!confirm('رقم کنترل کارت یا شبا درست نیست (احتمال اشتباه تایپی). با این حال ذخیره شود؟')) return; }
      this.disabled=true;
      (r ? bkApi('PUT','/api/bank-accounts/'+r.id, body) : bkApi('POST','/api/bank-accounts', body))
        .then(()=>{ closeModal(); $('modal').classList.remove('wide'); showToast(r?'✅ ویرایش ذخیره شد':'✅ حساب جدید ثبت شد'); bkLoad(); })
        .catch(e=>{ E.textContent='❌ '+e.message; this.disabled=false; });
    };
  }
  document.addEventListener('toggle', e=>{ const d=e.target; if(!d.classList || !d.classList.contains('bk-sec') || q) return; BK_OPEN[d.dataset.cat]=d.open; try{ localStorage.setItem('bf_bank_open', JSON.stringify(BK_OPEN)); }catch(_){} }, true);

  $('q').value = q; render(); bkLoad();
</script>
</body>
</html>
